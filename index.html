<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Library - Browse High-Quality Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23111827'/%3E%3Cpath d='M10 28V12l10 10 10-10v16h-3.5V17.5l-6.5 6.5-6.5-6.5V28H10z' fill='white'/%3E%3C/svg%3E">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 36 36" width="34" height="34" fill="none">
            <rect width="36" height="36" rx="9" fill="#18181b"/>
            <path d="M9 25V11l9 9 9-9v14h-3.2V16l-5.8 5.8L12.2 16V25H9z" fill="white"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Motion</span>
          <span class="brand-sub">Library.</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="#resources" class="nav-link active">Resources</a>
        <a href="#sound-effects" class="nav-link">Sound Effects</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="main-content">
    <section class="hero-section">
      <div class="container hero-container">
        <h1 class="hero-title">Browse Resources</h1>
        <p class="hero-subtitle">
          Find, preview, and download the best high-quality royalty-free sound effects instantly.
        </p>

        <!-- Search Bar -->
        <div class="search-box">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search sound effects (e.g. whoosh, ding, cinematic, glitch)..." 
            autocomplete="off"
            aria-label="Search resources"
          >
          <button class="search-icon-btn" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

        <!-- Filter Tags (Dynamically built from real data) -->
        <div class="filter-pills" id="filterContainer">
          <button class="filter-pill active" data-category="all">All <span class="filter-count" id="count-all"></span></button>
          <button class="filter-pill" data-category="sound-effects">Sound Effects <span class="filter-count" id="count-sound-effects"></span></button>
        </div>

        <!-- Live Sync Status -->
        <div class="sync-indicator" id="syncStatus">
          <span class="sync-dot"></span>
          <span id="syncText">Loading sounds from Google Drive...</span>
        </div>
      </div>
    </section>

    <!-- Resources 6-Column Cube Grid Section -->
    <section class="resources-section">
      <div class="container">
        <!-- Floating currently playing bar if sound is playing -->
        <div class="now-playing-bar" id="nowPlayingBar" style="display: none;">
          <div class="now-playing-info">
            <span class="now-playing-label">NOW PLAYING:</span>
            <span class="now-playing-title" id="nowPlayingTitle">-</span>
          </div>
          <div class="now-playing-actions">
            <button class="now-playing-toggle" id="nowPlayingToggle" aria-label="Pause/Resume">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1"/>
                <rect x="14" y="4" width="4" height="16" rx="1"/>
              </svg>
            </button>
            <a class="now-playing-dl" id="nowPlayingDl" href="#" download title="Download this sound">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </a>
          </div>
        </div>

        <div class="resources-grid-cube" id="resourcesGrid">
          <!-- Dynamically populated 6-cube-per-row grid -->
        </div>

        <!-- Empty state when search has no matches -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">🔍</div>
          <h3>No sound effects found</h3>
          <p>Try searching for a different keyword or resetting your filter</p>
          <button class="btn-reset" id="resetBtn">Reset Search</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
